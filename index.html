<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MttoGest Biomédico</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:14px}
:root{
  --bg0:#0f1117;--bg1:#161b27;--bg2:#1e2535;--bg3:#252d3d;--bg4:#2e3852;
  --accent:#3b82f6;--accent2:#60a5fa;--accent3:#93c5fd;
  --green:#10b981;--green2:#34d399;
  --amber:#f59e0b;--amber2:#fbbf24;
  --red:#ef4444;--red2:#f87171;
  --purple:#8b5cf6;--purple2:#a78bfa;
  --teal:#0d9488;--teal2:#2dd4bf;
  --border:#2a3347;--border2:#374151;
  --text1:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --radius:8px;--radius2:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:var(--teal2);letter-spacing:.5px}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);transition:all .15s;margin-bottom:2px;font-size:13px}
.nav-item:hover{background:var(--bg3);color:var(--text1)}
.nav-item.active{background:var(--bg4);color:var(--teal2);font-weight:500}
.nav-item i{font-size:16px;width:18px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.db-status{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);background:var(--bg3)}
.db-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.main{margin-left:230px;flex:1;min-height:100vh}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:600;color:var(--text1)}
.topbar-right{display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-blue{background:rgba(59,130,246,.15);color:var(--accent2)}
.badge-green{background:rgba(16,185,129,.15);color:var(--green2)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber2)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red2)}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple2)}
.badge-teal{background:rgba(13,148,136,.15);color:var(--teal2)}
.badge-gray{background:rgba(100,116,139,.15);color:var(--text2)}
.content{padding:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;color:var(--text1)}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:var(--text1);line-height:1}
.stat-sub{font-size:11px;color:var(--text2);margin-top:4px}
.stat-icon{width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:18px}
.stat-trend{display:flex;align-items:center;gap:4px;font-size:11px;margin-top:4px}
.trend-up{color:var(--green2)}.trend-down{color:var(--red2)}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;min-width:900px}
.table th{text-align:left;padding:8px 12px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--bg3);color:var(--text1)}
.mono{font-family:monospace;font-size:12px;color:var(--accent3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--teal);color:#fff}.btn-primary:hover{background:#0f766e}
.btn-secondary{background:var(--bg3);color:var(--text1);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#059669}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.btn-icon:hover{background:var(--bg4);color:var(--text1)}
.input-group{margin-bottom:14px}
.input-label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.input{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text1);font-size:13px;outline:none;transition:border .15s}
.input:focus{border-color:var(--teal)}
.select{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text1);font-size:13px;outline:none;cursor:pointer}
.select:focus{border-color:var(--teal)}
.textarea{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text1);font-size:13px;outline:none;resize:vertical;min-height:80px;font-family:inherit}
.textarea:focus{border-color:var(--teal)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.section-divider{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--teal2);margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius2);padding:28px 20px;text-align:center;cursor:pointer;transition:all .15s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--teal);background:rgba(13,148,136,.05)}
.upload-zone i{font-size:28px;color:var(--text3);display:block;margin-bottom:8px}
.progress-bar{width:100%;height:4px;background:var(--bg4);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--teal);transition:width .3s}
.file-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:var(--radius)}
.file-info{flex:1}
.file-info p{font-size:13px;color:var(--text1);font-weight:500}
.file-info span{font-size:11px;color:var(--text3)}
.obs-item{padding:12px;background:var(--bg3);border-radius:var(--radius);margin-bottom:10px;border-left:3px solid var(--teal)}
.obs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.obs-author{font-size:12px;font-weight:600;color:var(--teal2)}
.obs-date{font-size:11px;color:var(--text3)}
.obs-text{font-size:13px;color:var(--text2);line-height:1.5}
.obs-equipo{font-size:11px;color:var(--text3);margin-top:4px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}.dot-blue{background:var(--accent)}.dot-gray{background:var(--text3)}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 12px;flex:1;max-width:320px}
.search-bar input{background:none;border:none;color:var(--text1);font-size:13px;outline:none;flex:1}
.search-bar i{color:var(--text3);font-size:16px}
.divider{height:1px;background:var(--border);margin:14px 0}
.empty-state{text-align:center;padding:40px 20px}
.empty-state i{font-size:40px;color:var(--text3);display:block;margin-bottom:10px}
.empty-state p{color:var(--text2);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border2);color:var(--text2);transition:all .15s}
.chip:hover{background:var(--bg3)}.chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.notification{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:300;min-width:280px;animation:slideIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.notif-icon{width:32px;height:32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:32px;height:32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.activity-content p{font-size:13px;color:var(--text1)}.activity-content span{font-size:11px;color:var(--text3)}
.flex{display:flex}.items-center{align-items:center}.gap-8{gap:8px}.flex-1{flex:1}.justify-between{justify-content:space-between}
.mb-16{margin-bottom:16px}.mt-8{margin-top:8px}.w-full{width:100%}
.equipo-detail{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}
.equipo-detail .lbl{color:var(--text3)}.equipo-detail .val{color:var(--text1);font-weight:500}
.sede-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;background:rgba(13,148,136,.12);color:var(--teal2)}
</style>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const db = window.supabase.createClient(
  'https://dxsnjwteujjissepawtz.supabase.co',
  'sb_publishable_C2NY5DxI6oxQV9EYPWC99A_7MLMpm5F'
);

const newId  = (p)  => `${p}${Date.now()}`;
const fmtM   = (v)  => `$${(v/1000000).toFixed(1)}M`;
const dias   = (f)  => Math.round((new Date(f)-new Date())/86400000);
const mapE   = (r)  => r?({...r, ultimoMtto:r.ultimo_mtto, proximoMtto:r.proximo_mtto}):r;
const mapC   = (r)  => r?({...r, driveFolder:r.drive_folder, equipos:r.equipos||[]}):r;
const mapR   = (r)  => r?({...r, archivoUrl:r.archivo_url}):r;

const CATEGORIAS = ['Apoyo vital','Diagnóstico por imagen','Monitoreo','Laboratorio','Quirúrgico','Esterilización','Rehabilitación','Terapia','Otro'];
const ESTADOS    = ['Operativo','En mantenimiento','En calibración','Fuera de servicio','Dado de baja'];

function App() {
  const [view,setView]         = useState('dashboard');
  const [data,setData]         = useState({equipos:[],proveedores:[],contratos:[],reportes:[],observaciones:[]});
  const [loading,setLoading]   = useState(true);
  const [modal,setModal]       = useState(null);
  const [notif,setNotif]       = useState(null);
  const [search,setSearch]     = useState('');
  const [filterChip,setChip]   = useState('Todos');

  const showNotif = (msg,type='success') => { setNotif({msg,type}); setTimeout(()=>setNotif(null),3500); };

  const loadData = useCallback(async () => {
    setLoading(true);
    try {
      const [eq,pv,ct,rp,ob] = await Promise.all([
        db.from('equipos').select('*').order('created_at'),
        db.from('proveedores').select('*').order('nombre'),
        db.from('contratos').select('*').order('created_at'),
        db.from('reportes').select('*').order('created_at',{ascending:false}),
        db.from('observaciones').select('*').order('created_at',{ascending:false}),
      ]);
      setData({
        equipos:       (eq.data||[]).map(mapE),
        proveedores:   pv.data||[],
        contratos:     (ct.data||[]).map(mapC),
        reportes:      (rp.data||[]).map(mapR),
        observaciones: ob.data||[],
      });
    } catch(e){ showNotif('Error: '+e.message,'error'); }
    setLoading(false);
  },[]);

  useEffect(()=>{ loadData(); },[loadData]);

  const addEquipo = async (eq) => {
    const id = newId('E');
    const {error} = await db.from('equipos').insert({
      id, nombre:eq.nombre, codigo:eq.codigo,
      sede:eq.sede||null, ubicacion:eq.ubicacion||null,
      serial:eq.serial||null, modelo:eq.modelo||null,
      categoria:eq.categoria, estado:eq.estado,
      proveedor:eq.proveedor||null,
      ultimo_mtto:eq.ultimoMtto||null, proximo_mtto:eq.proximoMtto||null,
      contrato:eq.contrato||null,
    });
    if(error){showNotif('Error: '+error.message,'error');return;}
    if(eq.contrato){
      const ct=data.contratos.find(c=>c.id===eq.contrato);
      if(ct) await db.from('contratos').update({equipos:[...(ct.equipos||[]),id]}).eq('id',eq.contrato);
    }
    setModal(null); showNotif('Equipo registrado correctamente'); loadData();
  };

  const updateEquipo = async (eq) => {
    const orig = data.equipos.find(e=>e.id===eq.id);
    if(orig?.contrato && orig.contrato!==eq.contrato){
      const oldCt=data.contratos.find(c=>c.id===orig.contrato);
      if(oldCt) await db.from('contratos').update({equipos:(oldCt.equipos||[]).filter(x=>x!==eq.id)}).eq('id',orig.contrato);
    }
    if(eq.contrato && eq.contrato!==orig?.contrato){
      const newCt=data.contratos.find(c=>c.id===eq.contrato);
      if(newCt) await db.from('contratos').update({equipos:[...(newCt.equipos||[]),eq.id]}).eq('id',eq.contrato);
    }
    const {error} = await db.from('equipos').update({
      nombre:eq.nombre, codigo:eq.codigo,
      sede:eq.sede||null, ubicacion:eq.ubicacion||null,
      serial:eq.serial||null, modelo:eq.modelo||null,
      categoria:eq.categoria, estado:eq.estado,
      proveedor:eq.proveedor||null,
      ultimo_mtto:eq.ultimoMtto||null, proximo_mtto:eq.proximoMtto||null,
      contrato:eq.contrato||null,
    }).eq('id',eq.id);
    if(error){showNotif('Error: '+error.message,'error');return;}
    setModal(null); showNotif('Equipo actualizado'); loadData();
  };

  const deleteEquipo = async (id) => {
    const eq=data.equipos.find(e=>e.id===id);
    if(eq?.contrato){
      const ct=data.contratos.find(c=>c.id===eq.contrato);
      if(ct) await db.from('contratos').update({equipos:(ct.equipos||[]).filter(x=>x!==id)}).eq('id',eq.contrato);
    }
    const {error} = await db.from('equipos').delete().eq('id',id);
    if(error){showNotif('Error: '+error.message,'error');return;}
    showNotif('Equipo eliminado','info'); loadData();
  };

  const addReporte = async (r) => {
    let archivo_url=null;
    const archivo_nombre=r.archivo?.name||'reporte.pdf';
    if(r.archivo){
      const path=`${r.contrato}/${Date.now()}_${r.archivo.name.replace(/\s/g,'_')}`;
      const {error:upErr} = await db.storage.from('reportes-pdf').upload(path,r.archivo);
      if(!upErr){
        const {data:ud}=db.storage.from('reportes-pdf').getPublicUrl(path);
        archivo_url=ud.publicUrl;
      }
    }
    const prov=data.contratos.find(c=>c.id===r.contrato)?.proveedor||'';
    const {error}=await db.from('reportes').insert({
      id:newId('R'), contrato:r.contrato, equipo:r.equipo,
      proveedor:prov, fecha:r.fecha, tipo:r.tipo,
      estado:'Pendiente revisión', archivo:archivo_nombre,
      archivo_url, notas:r.notas||null,
    });
    if(error){showNotif('Error: '+error.message,'error');return;}
    setModal(null); showNotif('Reporte cargado ✓'); loadData();
  };

  const aprobarReporte = async (id) => {
    const {error}=await db.from('reportes').update({estado:'Aprobado'}).eq('id',id);
    if(error){showNotif('Error: '+error.message,'error');return;}
    showNotif('Reporte aprobado'); loadData();
  };

  const addObservacion = async (obs) => {
    const {error}=await db.from('observaciones').insert({
      id:newId('O'), equipo:obs.equipo, reporte:obs.reporte||null,
      autor:obs.autor, fecha:new Date().toISOString().split('T')[0],
      texto:obs.texto, tipo:obs.tipo||'Comentario',
    });
    if(error){showNotif('Error: '+error.message,'error');return;}
    setModal(null); showNotif('Observación registrada'); loadData();
  };

  if(loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'var(--bg0)'}}>
      <div className="spinner"></div>
      <p style={{color:'var(--text2)',fontSize:14}}>Conectando...</p>
      <p style={{color:'var(--text3)',fontSize:12}}>MttoGest Biomédico</p>
    </div>
  );

  const navItems=[
    {id:'dashboard', label:'Panel principal',       icon:'ti-layout-dashboard'},
    {id:'equipos',   label:'Equipos Biomédicos',    icon:'ti-heartbeat'},
    {id:'contratos', label:'Contratos de Mtto',     icon:'ti-file-text'},
    {id:'reportes',  label:'Reportes de Mtto',      icon:'ti-clipboard-list'},
    {id:'observaciones',label:'Observaciones',      icon:'ti-message-2'},
    {id:'drive',     label:'Archivos / Storage',    icon:'ti-database'},
  ];
  const topTitles={dashboard:'Panel de Control',equipos:'Equipos Biomédicos',contratos:'Contratos de Mantenimiento',reportes:'Reportes de Mantenimiento',observaciones:'Observaciones y Novedades',drive:'Archivos y Storage'};
  const pendientes=data.reportes.filter(r=>r.estado==='Pendiente revisión').length;
  const alertas=data.observaciones.filter(o=>o.tipo==='Alerta').length;

  const views={
    dashboard:     <Dashboard data={data} setView={setView}/>,
    equipos:       <Equipos data={data} search={search} setSearch={setSearch} filterChip={filterChip} setFilterChip={setChip} setModal={setModal} deleteEquipo={deleteEquipo}/>,
    reportes:      <Reportes data={data} setModal={setModal} aprobarReporte={aprobarReporte}/>,
    contratos:     <Contratos data={data}/>,
    observaciones: <Observaciones data={data} setModal={setModal}/>,
    drive:         <DriveView data={data}/>,
  };

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <h1><i className="ti ti-heart-rate-monitor" style={{marginRight:6}}></i>MttoGest Biomédico</h1>
          <p>Gestión de Equipos y Contratos</p>
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section">Módulos</div>
          {navItems.map(n=>(
            <div key={n.id} className={`nav-item${view===n.id?' active':''}`} onClick={()=>setView(n.id)}>
              <i className={`ti ${n.icon}`}></i>
              <span>{n.label}</span>
              {n.id==='reportes'&&pendientes>0&&<span className="badge badge-amber" style={{marginLeft:'auto',padding:'2px 7px',fontSize:10}}>{pendientes}</span>}
              {n.id==='observaciones'&&alertas>0&&<span className="badge badge-red" style={{marginLeft:'auto',padding:'2px 7px',fontSize:10}}>{alertas}</span>}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="db-status">
            <div className="db-dot"></div>
            <div>
              <p style={{fontSize:11,fontWeight:600,color:'#e2e8f0'}}>Supabase · Conectado</p>
              <span style={{fontSize:10,color:'var(--text3)'}}>{data.equipos.length} equipos · {data.reportes.length} reportes</span>
            </div>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="topbar-title">{topTitles[view]}</div>
          <div className="topbar-right">
            {view==='reportes'      &&<button className="btn btn-primary btn-sm" onClick={()=>setModal('upload-reporte')}><i className="ti ti-upload"></i> Cargar reporte</button>}
            {view==='equipos'       &&<button className="btn btn-primary btn-sm" onClick={()=>setModal('add-equipo')}><i className="ti ti-plus"></i> Nuevo equipo</button>}
            {view==='observaciones' &&<button className="btn btn-primary btn-sm" onClick={()=>setModal('add-obs')}><i className="ti ti-plus"></i> Nueva observación</button>}
            <button className="btn-icon" onClick={loadData} title="Recargar"><i className="ti ti-refresh"></i></button>
          </div>
        </div>
        <div className="content">{views[view]}</div>
      </main>

      {modal==='upload-reporte'     &&<ModalUpload data={data} onClose={()=>setModal(null)} onSave={addReporte}/>}
      {modal==='add-equipo'         &&<ModalEquipo data={data} onClose={()=>setModal(null)} onSave={addEquipo}/>}
      {modal?.type==='edit-equipo'  &&<ModalEquipo data={data} equipo={modal.equipo} onClose={()=>setModal(null)} onSave={updateEquipo}/>}
      {modal==='add-obs'            &&<ModalObs data={data} onClose={()=>setModal(null)} onSave={addObservacion}/>}
      {modal?.type==='view-reporte' &&<ModalViewReporte reporte={modal.reporte} data={data} onClose={()=>setModal(null)} onAprobar={aprobarReporte} onObs={addObservacion}/>}
      {modal?.type==='view-equipo'  &&<ModalViewEquipo equipo={modal.equipo} data={data} onClose={()=>setModal(null)} setModal={setModal}/>}

      {notif&&(
        <div className="notification">
          <div className="notif-icon" style={{background:notif.type==='success'?'rgba(16,185,129,.2)':notif.type==='error'?'rgba(239,68,68,.2)':'rgba(13,148,136,.2)'}}>
            <i className={`ti ${notif.type==='success'?'ti-check':notif.type==='error'?'ti-alert-circle':'ti-info-circle'}`} style={{color:notif.type==='success'?'var(--green2)':notif.type==='error'?'var(--red2)':'var(--teal2)'}}></i>
          </div>
          <p style={{fontSize:13,fontWeight:500,color:'var(--text1)',flex:1}}>{notif.msg}</p>
          <i className="ti ti-x" style={{color:'var(--text3)',cursor:'pointer'}} onClick={()=>setNotif(null)}></i>
        </div>
      )}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({data,setView}){
  const pendientes=data.reportes.filter(r=>r.estado==='Pendiente revisión').length;
  const alertas=data.observaciones.filter(o=>o.tipo==='Alerta').length;
  const alerta=data.equipos.filter(e=>e.estado==='Alerta'||e.estado==='En calibración').length;
  const sedes=[...new Set(data.equipos.map(e=>e.sede).filter(Boolean))];
  const prox=data.equipos.filter(e=>e.proximoMtto).sort((a,b)=>new Date(a.proximoMtto)-new Date(b.proximoMtto)).slice(0,6);

  return (
    <div>
      <div className="grid-4">
        <StatCard label="Equipos operativos" value={data.equipos.filter(e=>e.estado==='Operativo').length} sub={`de ${data.equipos.length} equipos`} icon="ti-heartbeat" iconBg="rgba(13,148,136,.15)" iconColor="var(--teal2)" trend={`${sedes.length} sede${sedes.length!==1?'s':''}`} trendUp={true}/>
        <StatCard label="Reportes pendientes" value={pendientes} sub="esperan revisión" icon="ti-clipboard-list" iconBg="rgba(245,158,11,.15)" iconColor="var(--amber2)" trend={pendientes>0?'Requieren atención':'Al día'} trendUp={pendientes===0}/>
        <StatCard label="Contratos activos" value={data.contratos.filter(c=>c.estado==='Activo').length} sub={`${fmtM(data.contratos.reduce((s,c)=>s+(c.valor||0),0))} en contratos`} icon="ti-file-text" iconBg="rgba(139,92,246,.15)" iconColor="var(--purple2)" trend="Todos vigentes" trendUp={true}/>
        <StatCard label="Alertas / Novedades" value={alertas+alerta} sub={`${data.observaciones.length} observaciones`} icon="ti-alert-triangle" iconBg="rgba(239,68,68,.15)" iconColor="var(--red2)" trend={alertas>0?'Requieren atención':'Sin alertas'} trendUp={alertas===0}/>
      </div>

      <div className="grid-2" style={{marginBottom:24}}>
        <div className="card">
          <div className="card-header"><span className="card-title"><i className="ti ti-calendar-clock" style={{marginRight:6}}></i>Próximos mantenimientos</span><button className="btn btn-secondary btn-sm" onClick={()=>setView('equipos')}>Ver todos</button></div>
          {prox.length===0?<div className="empty-state"><i className="ti ti-calendar"></i><p>Sin mantenimientos programados</p></div>:(
            <table className="table" style={{minWidth:'unset'}}>
              <thead><tr><th>Equipo</th><th>Sede</th><th>Fecha</th><th></th></tr></thead>
              <tbody>
                {prox.map(e=>{
                  const d=dias(e.proximoMtto);
                  return (
                    <tr key={e.id}>
                      <td><div style={{fontWeight:500,color:'var(--text1)',fontSize:12}}>{e.nombre.substring(0,30)}</div><div className="mono">{e.codigo}</div></td>
                      <td><span className="sede-badge"><i className="ti ti-building-hospital" style={{fontSize:11}}></i>{e.sede||'—'}</span></td>
                      <td style={{fontSize:12}}>{e.proximoMtto}</td>
                      <td><span className={`badge ${d<0?'badge-red':d<30?'badge-amber':'badge-green'}`}>{d<0?'Vencido':d<30?`${d}d`:'OK'}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title"><i className="ti ti-chart-bar" style={{marginRight:6}}></i>Equipos por categoría</span></div>
          <div style={{display:'grid',gap:8}}>
            {CATEGORIAS.map(cat=>{
              const eqs=data.equipos.filter(e=>e.categoria===cat);
              if(!eqs.length) return null;
              const ok=eqs.filter(e=>e.estado==='Operativo').length;
              return (
                <div key={cat} className="flex items-center gap-8">
                  <span style={{fontSize:12,color:'var(--text2)',width:160,flexShrink:0}}>{cat}</span>
                  <div style={{flex:1,background:'var(--bg4)',borderRadius:4,height:6,overflow:'hidden'}}>
                    <div style={{height:'100%',borderRadius:4,background:ok===eqs.length?'var(--teal)':'var(--amber)',width:`${ok/eqs.length*100}%`,transition:'width .3s'}}></div>
                  </div>
                  <span style={{fontSize:12,color:'var(--text3)',width:36,textAlign:'right'}}>{ok}/{eqs.length}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {sedes.length>0&&(
        <div className="card">
          <div className="card-header"><span className="card-title"><i className="ti ti-building-hospital" style={{marginRight:6}}></i>Resumen por sede</span></div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            {sedes.map(s=>{
              const eqs=data.equipos.filter(e=>e.sede===s);
              const ok=eqs.filter(e=>e.estado==='Operativo').length;
              return (
                <div key={s} style={{flex:'1 1 160px',background:'var(--bg3)',borderRadius:'var(--radius)',padding:'12px'}}>
                  <div style={{fontSize:11,color:'var(--teal2)',marginBottom:4,fontWeight:600}}><i className="ti ti-building-hospital" style={{fontSize:11,marginRight:4}}></i>{s}</div>
                  <div style={{fontSize:22,fontWeight:700,color:'var(--text1)'}}>{eqs.length}<span style={{fontSize:13,color:'var(--text3)',marginLeft:4}}>equipos</span></div>
                  <div className="progress-bar" style={{marginTop:8}}><div className="progress-fill" style={{width:`${eqs.length?ok/eqs.length*100:0}%`,background:ok===eqs.length?'var(--teal)':'var(--amber)'}}></div></div>
                  <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>{ok} operativos</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function StatCard({label,value,sub,icon,iconBg,iconColor,trend,trendUp}){
  return (
    <div className="stat-card">
      <div className="flex justify-between items-center" style={{marginBottom:10}}>
        <div className="stat-label">{label}</div>
        <div className="stat-icon" style={{background:iconBg}}><i className={`ti ${icon}`} style={{color:iconColor}}></i></div>
      </div>
      <div className="stat-value">{value}</div>
      <div className="stat-sub">{sub}</div>
      {trend&&<div className={`stat-trend ${trendUp?'trend-up':'trend-down'}`}><i className={`ti ${trendUp?'ti-trending-up':'ti-alert-circle'}`} style={{fontSize:12}}></i>{trend}</div>}
    </div>
  );
}

// ── Equipos ───────────────────────────────────────────────────────────────────
function Equipos({data,search,setSearch,filterChip,setFilterChip,setModal,deleteEquipo}){
  const sedes=['Todos',...new Set(data.equipos.map(e=>e.sede).filter(Boolean))];
  const filtered=data.equipos.filter(e=>{
    const ms=filterChip==='Todos'||e.sede===filterChip;
    const mq=!search||[e.nombre,e.codigo,e.serial,e.modelo,e.ubicacion].some(v=>v&&v.toLowerCase().includes(search.toLowerCase()));
    return ms&&mq;
  });
  return (
    <div>
      <div className="flex items-center justify-between mb-16">
        <div className="search-bar">
          <i className="ti ti-search"></i>
          <input placeholder="Buscar nombre, código, serial, modelo..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <span style={{fontSize:12,color:'var(--text3)'}}>{filtered.length} equipos</span>
      </div>
      <div className="chips">{sedes.map(s=><div key={s} className={`chip${filterChip===s?' active':''}`} onClick={()=>setFilterChip(s)}>{s}</div>)}</div>
      <div className="card">
        <div className="table-wrap">
          <table className="table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Nombre del equipo</th>
                <th>Modelo / Serial</th>
                <th>Sede</th>
                <th>Ubicación</th>
                <th>Categoría</th>
                <th>Estado</th>
                <th>Próximo Mtto</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(e=>{
                const d=e.proximoMtto?dias(e.proximoMtto):999;
                return (
                  <tr key={e.id}>
                    <td><span className="mono">{e.codigo}</span></td>
                    <td>
                      <div style={{fontWeight:500,color:'var(--text1)',fontSize:13}}>{e.nombre}</div>
                      <div style={{fontSize:11,color:'var(--text3)'}}>{e.proveedor||'Sin proveedor'}</div>
                    </td>
                    <td>
                      <div style={{fontSize:12,color:'var(--text1)'}}>{e.modelo||'—'}</div>
                      <div className="mono" style={{fontSize:11,color:'var(--text3)'}}>{e.serial||'—'}</div>
                    </td>
                    <td><span className="sede-badge"><i className="ti ti-building-hospital" style={{fontSize:10}}></i>{e.sede||'—'}</span></td>
                    <td style={{fontSize:12,color:'var(--text3)'}}>{e.ubicacion||'—'}</td>
                    <td><span className="badge badge-teal">{e.categoria}</span></td>
                    <td>
                      <span className={`status-dot dot-${e.estado==='Operativo'?'green':e.estado==='En mantenimiento'||e.estado==='En calibración'?'amber':'red'}`}></span>
                      <span style={{fontSize:12}}>{e.estado}</span>
                    </td>
                    <td>{e.proximoMtto?<span className={`badge ${d<0?'badge-red':d<30?'badge-amber':'badge-green'}`}>{e.proximoMtto}</span>:'—'}</td>
                    <td>
                      <div className="flex gap-8">
                        <button className="btn-icon" title="Ver detalle" onClick={()=>setModal({type:'view-equipo',equipo:e})}><i className="ti ti-eye"></i></button>
                        <button className="btn-icon" title="Editar" onClick={()=>setModal({type:'edit-equipo',equipo:e})}><i className="ti ti-edit"></i></button>
                        <button className="btn-icon" style={{borderColor:'rgba(239,68,68,.3)',color:'var(--red2)'}} title="Eliminar" onClick={()=>{if(confirm(`¿Eliminar ${e.nombre}?`))deleteEquipo(e.id)}}><i className="ti ti-trash"></i></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          {filtered.length===0&&<div className="empty-state"><i className="ti ti-heartbeat"></i><p>No se encontraron equipos</p></div>}
        </div>
      </div>
    </div>
  );
}

// ── Modal Equipo ──────────────────────────────────────────────────────────────
function ModalEquipo({data,equipo,onClose,onSave}){
  const blank={nombre:'',codigo:'',sede:'',ubicacion:'',serial:'',modelo:'',categoria:'Monitoreo',estado:'Operativo',proveedor:'',ultimoMtto:'',proximoMtto:'',contrato:''};
  const [form,setForm]=useState(equipo||blank);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div className="flex items-center gap-8">
            <i className="ti ti-heart-rate-monitor" style={{color:'var(--teal2)',fontSize:18}}></i>
            <span style={{fontWeight:600,color:'var(--text1)'}}>{equipo?'Editar equipo biomédico':'Registrar equipo biomédico'}</span>
          </div>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">

          <div className="section-divider">Identificación del equipo</div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Nombre del equipo *</label><input className="input" value={form.nombre} onChange={e=>set('nombre',e.target.value)} placeholder="Ventilador Puritan Bennett 840"/></div>
            <div className="input-group"><label className="input-label">Código / Inventario *</label><input className="input" value={form.codigo} onChange={e=>set('codigo',e.target.value)} placeholder="VM-001" style={{fontFamily:'monospace'}}/></div>
          </div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Modelo</label><input className="input" value={form.modelo||''} onChange={e=>set('modelo',e.target.value)} placeholder="Puritan Bennett 840"/></div>
            <div className="input-group"><label className="input-label">Serial</label><input className="input" value={form.serial||''} onChange={e=>set('serial',e.target.value)} placeholder="PB840-2019-00341" style={{fontFamily:'monospace'}}/></div>
          </div>

          <div className="section-divider">Ubicación</div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Sede *</label><input className="input" value={form.sede||''} onChange={e=>set('sede',e.target.value)} placeholder="Sede Principal / Sede Norte"/></div>
            <div className="input-group"><label className="input-label">Ubicación dentro de la sede *</label><input className="input" value={form.ubicacion||''} onChange={e=>set('ubicacion',e.target.value)} placeholder="UCI Adultos - Piso 3"/></div>
          </div>

          <div className="section-divider">Clasificación y estado</div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Categoría biomédica</label>
              <select className="select" value={form.categoria} onChange={e=>set('categoria',e.target.value)}>
                {CATEGORIAS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="input-group"><label className="input-label">Estado actual</label>
              <select className="select" value={form.estado} onChange={e=>set('estado',e.target.value)}>
                {ESTADOS.map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>

          <div className="section-divider">Mantenimiento y contrato</div>
          <div className="input-group"><label className="input-label">Proveedor de mantenimiento</label>
            <select className="select" value={form.proveedor||''} onChange={e=>set('proveedor',e.target.value)}>
              <option value="">Sin asignar</option>
              {data.proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
            </select>
          </div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Último mantenimiento</label><input type="date" className="input" value={form.ultimoMtto||''} onChange={e=>set('ultimoMtto',e.target.value)}/></div>
            <div className="input-group"><label className="input-label">Próximo mantenimiento</label><input type="date" className="input" value={form.proximoMtto||''} onChange={e=>set('proximoMtto',e.target.value)}/></div>
          </div>
          <div className="input-group"><label className="input-label">Contrato vinculado</label>
            <select className="select" value={form.contrato||''} onChange={e=>set('contrato',e.target.value)}>
              <option value="">Sin contrato</option>
              {data.contratos.map(c=><option key={c.id} value={c.id}>{c.id} · {c.nombre.substring(0,40)}</option>)}
            </select>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={()=>onSave(form)} disabled={!form.nombre||!form.codigo}><i className="ti ti-check"></i> {equipo?'Guardar cambios':'Registrar equipo'}</button>
        </div>
      </div>
    </div>
  );
}

// ── Modal Ver Equipo ──────────────────────────────────────────────────────────
function ModalViewEquipo({equipo,data,onClose,setModal}){
  const reps=data.reportes.filter(r=>r.equipo===equipo.id);
  const obs=data.observaciones.filter(o=>o.equipo===equipo.id);
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:560}}>
        <div className="modal-header">
          <div className="flex items-center gap-8">
            <i className="ti ti-heart-rate-monitor" style={{color:'var(--teal2)',fontSize:18}}></i>
            <span style={{fontWeight:600,color:'var(--text1)'}}>{equipo.nombre}</span>
          </div>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            <span className="mono" style={{fontSize:13}}>{equipo.codigo}</span>
            <span className={`badge ${equipo.estado==='Operativo'?'badge-green':equipo.estado==='En mantenimiento'||equipo.estado==='En calibración'?'badge-amber':'badge-red'}`}>{equipo.estado}</span>
            <span className="badge badge-teal">{equipo.categoria}</span>
          </div>

          <div style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:'14px',marginBottom:14}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,fontSize:13}}>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Modelo</div><div style={{color:'var(--text1)',fontWeight:500}}>{equipo.modelo||'—'}</div></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Serial</div><div className="mono">{equipo.serial||'—'}</div></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Sede</div><span className="sede-badge"><i className="ti ti-building-hospital" style={{fontSize:11}}></i>{equipo.sede||'—'}</span></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Ubicación</div><div style={{color:'var(--text1)'}}>{equipo.ubicacion||'—'}</div></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Proveedor</div><div style={{color:'var(--text1)'}}>{equipo.proveedor||'—'}</div></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Contrato</div><div className="mono" style={{fontSize:12}}>{equipo.contrato||'—'}</div></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Último Mtto</div><div style={{color:'var(--text1)'}}>{equipo.ultimoMtto||'—'}</div></div>
              <div><div style={{fontSize:11,color:'var(--text3)',marginBottom:2}}>Próximo Mtto</div>
                {equipo.proximoMtto?<span className={`badge ${dias(equipo.proximoMtto)<0?'badge-red':dias(equipo.proximoMtto)<30?'badge-amber':'badge-green'}`}>{equipo.proximoMtto}</span>:<span style={{color:'var(--text3)'}}>—</span>}
              </div>
            </div>
          </div>

          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Reportes de mantenimiento ({reps.length})</div>
            {reps.length===0?<div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic'}}>Sin reportes</div>:
            reps.slice(0,4).map(r=>(
              <div key={r.id} className="flex items-center gap-8" style={{padding:'8px 10px',background:'var(--bg3)',borderRadius:'var(--radius)',marginBottom:6}}>
                <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:16}}></i>
                <div style={{flex:1}}><div style={{fontSize:12,color:'var(--text1)'}}>{r.archivo}</div><div style={{fontSize:11,color:'var(--text3)'}}>{r.fecha} · {r.tipo}</div></div>
                <span className={`badge ${r.estado==='Aprobado'?'badge-green':'badge-amber'}`}>{r.estado}</span>
              </div>
            ))}
          </div>

          {obs.length>0&&(
            <div>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Observaciones ({obs.length})</div>

// ── Modal Upload ──────────────────────────────────────────────────────────────
function ModalUpload({data,onClose,onSave}){
  const [form,setForm]=useState({contrato:'',equipo:'',fecha:new Date().toISOString().split('T')[0],tipo:'Preventivo',archivo:null,notas:''});
  const [progress,setP]=useState(0);
  const [uploading,setUpl]=useState(false);
  const [uploaded,setDone]=useState(false);
  const [drag,setDrag]=useState(false);
  const fileRef=useRef();
  const contrato=data.contratos.find(c=>c.id===form.contrato);
  const equiposDisp=contrato?data.equipos.filter(e=>(contrato.equipos||[]).includes(e.id)):[];
  const handleFile=(file)=>{
    if(!file)return;
    setForm(f=>({...f,archivo:file})); setUpl(true); setP(0);
    let p=0; const iv=setInterval(()=>{p+=Math.random()*30;if(p>=100){p=100;clearInterval(iv);setUpl(false);setDone(true);}setP(Math.min(p,100));},200);
  };
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div className="flex items-center gap-8"><i className="ti ti-upload" style={{color:'var(--teal2)',fontSize:18}}></i><span style={{fontWeight:600,color:'var(--text1)'}}>Cargar Reporte de Mantenimiento</span></div>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">
          <div className="two-col">
            <div className="input-group"><label className="input-label">Contrato *</label>
              <select className="select" value={form.contrato} onChange={e=>setForm(f=>({...f,contrato:e.target.value,equipo:''}))}>
                <option value="">Seleccionar...</option>
                {data.contratos.map(c=><option key={c.id} value={c.id}>{c.id} · {c.proveedor}</option>)}
              </select>
            </div>
            <div className="input-group"><label className="input-label">Equipo *</label>
              <select className="select" value={form.equipo} onChange={e=>setForm(f=>({...f,equipo:e.target.value}))} disabled={!form.contrato}>
                <option value="">Seleccionar...</option>
                {equiposDisp.map(e=><option key={e.id} value={e.id}>{e.codigo} · {e.nombre.substring(0,30)}</option>)}
              </select>
            </div>
          </div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Fecha del servicio *</label><input type="date" className="input" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/></div>
            <div className="input-group"><label className="input-label">Tipo</label>
              <select className="select" value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                <option>Preventivo</option><option>Correctivo</option><option>Predictivo</option><option>Calibración</option><option>Verificación</option>
              </select>
            </div>
          </div>
          <div className="input-group">
            <label className="input-label">Archivo PDF *</label>
            <div className={`upload-zone${drag?' drag':''}`} onClick={()=>fileRef.current.click()} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}>
              <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
              {!form.archivo?<><i className="ti ti-cloud-upload"></i><p>Arrastra el PDF aquí o haz clic</p><span>PDF hasta 20MB · Guardado en Supabase Storage</span></>:(
                <div className="file-item" style={{textAlign:'left'}}>
                  <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:22}}></i>
                  <div className="file-info">
                    <p>{form.archivo.name}</p>
                    <span>{(form.archivo.size/1024).toFixed(1)} KB</span>
                    {uploading&&<div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}></div></div>}
                    {uploaded&&<div style={{fontSize:11,color:'var(--green2)',marginTop:4}}><i className="ti ti-check"></i> Listo para guardar</div>}
                  </div>
                  {uploaded&&<i className="ti ti-check" style={{color:'var(--green2)',fontSize:18}}></i>}
                </div>
              )}
            </div>
          </div>
          <div className="input-group"><label className="input-label">Observaciones del servicio</label><textarea className="textarea" placeholder="Trabajos realizados, hallazgos, repuestos usados, recomendaciones..." value={form.notas} onChange={e=>setForm(f=>({...f,notas:e.target.value}))}></textarea></div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={()=>{if(form.contrato&&form.equipo&&form.archivo)onSave(form);}} disabled={!form.contrato||!form.equipo||!form.archivo}><i className="ti ti-upload"></i> Guardar reporte</button>
        </div>
      </div>
    </div>
  );
}

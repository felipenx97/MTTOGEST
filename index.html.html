<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MttoGest - Gestión de Contratos de Mantenimiento</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh;font-size:14px}
:root{
  --bg0:#0f1117;--bg1:#161b27;--bg2:#1e2535;--bg3:#252d3d;--bg4:#2e3852;
  --accent:#3b82f6;--accent2:#60a5fa;--accent3:#93c5fd;
  --green:#10b981;--green2:#34d399;
  --amber:#f59e0b;--amber2:#fbbf24;
  --red:#ef4444;--red2:#f87171;
  --purple:#8b5cf6;--purple2:#a78bfa;
  --border:#2a3347;--border2:#374151;
  --text1:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
  --radius:8px;--radius2:12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.spinner{width:36px;height:36px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
.app{display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--bg1);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100}
.sidebar-logo{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:15px;font-weight:700;color:var(--accent2);letter-spacing:.5px}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-section{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:8px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);transition:all .15s;margin-bottom:2px;font-size:13px}
.nav-item:hover{background:var(--bg3);color:var(--text1)}
.nav-item.active{background:var(--bg4);color:var(--accent2);font-weight:500}
.nav-item i{font-size:16px;width:18px;flex-shrink:0}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.drive-status{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);background:var(--bg3);cursor:pointer}
.drive-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.main{margin-left:220px;flex:1;min-height:100vh}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-size:16px;font-weight:600;color:var(--text1)}
.topbar-right{display:flex;align-items:center;gap:12px}
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge-blue{background:rgba(59,130,246,.15);color:var(--accent2)}
.badge-green{background:rgba(16,185,129,.15);color:var(--green2)}
.badge-amber{background:rgba(245,158,11,.15);color:var(--amber2)}
.badge-red{background:rgba(239,68,68,.15);color:var(--red2)}
.badge-purple{background:rgba(139,92,246,.15);color:var(--purple2)}
.badge-gray{background:rgba(100,116,139,.15);color:var(--text2)}
.content{padding:24px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;color:var(--text1)}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:16px}
.stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:26px;font-weight:700;color:var(--text1);line-height:1}
.stat-sub{font-size:11px;color:var(--text2);margin-top:4px}
.stat-icon{width:36px;height:36px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:18px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;padding:8px 12px;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
.table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2)}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:var(--bg3);color:var(--text1)}
.table .mono{font-family:monospace;font-size:12px;color:var(--accent3)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:#2563eb}
.btn-secondary{background:var(--bg3);color:var(--text1);border:1px solid var(--border2)}.btn-secondary:hover{background:var(--bg4)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:#059669}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-icon{padding:6px;border-radius:var(--radius);background:var(--bg3);border:1px solid var(--border);color:var(--text2);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.btn-icon:hover{background:var(--bg4);color:var(--text1)}
.input-group{margin-bottom:14px}
.input-label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500}
.input{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text1);font-size:13px;outline:none;transition:border .15s}
.input:focus{border-color:var(--accent)}
.select{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text1);font-size:13px;outline:none;cursor:pointer}
.textarea{width:100%;padding:8px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text1);font-size:13px;outline:none;resize:vertical;min-height:80px;font-family:inherit}
.textarea:focus{border-color:var(--accent)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;width:100%;max-width:520px;max-height:85vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg2);z-index:1}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.upload-zone{border:2px dashed var(--border2);border-radius:var(--radius2);padding:32px 20px;text-align:center;cursor:pointer;transition:all .15s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--accent);background:rgba(59,130,246,.05)}
.upload-zone i{font-size:32px;color:var(--text3);display:block;margin-bottom:8px}
.progress-bar{width:100%;height:4px;background:var(--bg4);border-radius:2px;margin-top:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .3s}
.file-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border-radius:var(--radius)}
.file-info{flex:1}
.file-info p{font-size:13px;color:var(--text1);font-weight:500}
.file-info span{font-size:11px;color:var(--text3)}
.drive-tree{padding:8px 0}
.drive-folder{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius);cursor:pointer;transition:background .1s}
.drive-folder:hover{background:var(--bg3)}
.drive-folder i{font-size:16px;color:var(--amber)}
.drive-folder span{font-size:13px;color:var(--text2)}
.drive-subfolder{padding-left:20px}
.obs-item{padding:12px;background:var(--bg3);border-radius:var(--radius);margin-bottom:10px;border-left:3px solid var(--accent)}
.obs-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.obs-author{font-size:12px;font-weight:600;color:var(--accent2)}
.obs-date{font-size:11px;color:var(--text3)}
.obs-text{font-size:13px;color:var(--text2);line-height:1.5}
.obs-equipo{font-size:11px;color:var(--text3);margin-top:4px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.dot-green{background:var(--green)}.dot-amber{background:var(--amber)}.dot-red{background:var(--red)}.dot-blue{background:var(--accent)}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:6px 12px;flex:1;max-width:280px}
.search-bar input{background:none;border:none;color:var(--text1);font-size:13px;outline:none;flex:1}
.search-bar i{color:var(--text3);font-size:16px}
.divider{height:1px;background:var(--border);margin:16px 0}
.empty-state{text-align:center;padding:40px 20px}
.empty-state i{font-size:40px;color:var(--text3);display:block;margin-bottom:10px}
.empty-state p{color:var(--text2);font-size:14px}
.avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:4px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid var(--border2);color:var(--text2);transition:all .15s}
.chip:hover{background:var(--bg3)}.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.notification{position:fixed;bottom:20px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:300;min-width:260px;animation:slideIn .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.notif-icon{width:32px;height:32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-trend{display:flex;align-items:center;gap:4px;font-size:11px;margin-top:4px}
.trend-up{color:var(--green2)}.trend-down{color:var(--red2)}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.activity-item:last-child{border-bottom:none}
.activity-icon{width:32px;height:32px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;margin-top:2px}
.activity-content p{font-size:13px;color:var(--text1)}.activity-content span{font-size:11px;color:var(--text3)}
.flex{display:flex}.items-center{align-items:center}.gap-8{gap:8px}.gap-12{gap:12px}.flex-1{flex:1}.justify-between{justify-content:space-between}
.mb-16{margin-bottom:16px}.mt-8{margin-top:8px}.w-full{width:100%}
.error-banner{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:var(--radius);padding:10px 14px;color:var(--red2);font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Supabase ──────────────────────────────────────────────────────────────────
const db = window.supabase.createClient(
  'https://dxsnjwteujjissepawtz.supabase.co',
  'sb_publishable_C2NY5DxI6oxQV9EYPWC99A_7MLMpm5F'
);

// ── Helpers ───────────────────────────────────────────────────────────────────
const newId = (prefix) => `${prefix}${Date.now()}`;
const fmtValor = (v) => `$${(v/1000000).toFixed(1)}M`;
const diasHasta = (fecha) => Math.round((new Date(fecha) - new Date()) / 86400000);

// Mapeo snake_case → camelCase para equipos
const mapE = (r) => r ? ({ ...r, ultimoMtto: r.ultimo_mtto, proximoMtto: r.proximo_mtto }) : r;
const mapC = (r) => r ? ({ ...r, driveFolder: r.drive_folder, equipos: r.equipos || [] }) : r;
const mapR = (r) => r ? ({ ...r, archivoUrl: r.archivo_url, driveId: r.drive_id }) : r;

// ── App principal ─────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState('dashboard');
  const [data, setData] = useState({ equipos:[], proveedores:[], contratos:[], reportes:[], observaciones:[] });
  const [loading, setLoading] = useState(true);
  const [modal, setModal] = useState(null);
  const [notif, setNotif] = useState(null);
  const [search, setSearch] = useState('');
  const [filterChip, setFilterChip] = useState('Todos');

  const showNotif = (msg, type='success') => {
    setNotif({ msg, type });
    setTimeout(() => setNotif(null), 3500);
  };

  const loadData = useCallback(async () => {
    setLoading(true);
    try {
      const [eq, pv, ct, rp, ob] = await Promise.all([
        db.from('equipos').select('*').order('created_at'),
        db.from('proveedores').select('*').order('nombre'),
        db.from('contratos').select('*').order('created_at'),
        db.from('reportes').select('*').order('created_at', { ascending: false }),
        db.from('observaciones').select('*').order('created_at', { ascending: false }),
      ]);
      if (eq.error || ct.error || rp.error || ob.error) throw new Error('Error consultando datos');
      setData({
        equipos:       (eq.data || []).map(mapE),
        proveedores:   pv.data || [],
        contratos:     (ct.data || []).map(mapC),
        reportes:      (rp.data || []).map(mapR),
        observaciones: ob.data || [],
      });
    } catch (e) {
      showNotif('Error cargando datos: ' + e.message, 'error');
    }
    setLoading(false);
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  // ── CRUD Equipos ────────────────────────────────────────────────
  const addEquipo = async (eq) => {
    const id = newId('E');
    const { error } = await db.from('equipos').insert({
      id, nombre: eq.nombre, codigo: eq.codigo, ubicacion: eq.ubicacion || null,
      categoria: eq.categoria, estado: eq.estado, proveedor: eq.proveedor || null,
      ultimo_mtto: eq.ultimoMtto || null, proximo_mtto: eq.proximoMtto || null,
      contrato: eq.contrato || null,
    });
    if (error) { showNotif('Error: ' + error.message, 'error'); return; }
    // Actualizar array equipos del contrato
    if (eq.contrato) {
      const ct = data.contratos.find(c => c.id === eq.contrato);
      if (ct) await db.from('contratos').update({ equipos: [...(ct.equipos||[]), id] }).eq('id', eq.contrato);
    }
    setModal(null); showNotif('Equipo agregado correctamente'); loadData();
  };

  const updateEquipo = async (eq) => {
    // Si cambió el contrato, actualizar los arrays
    const original = data.equipos.find(e => e.id === eq.id);
    if (original?.contrato && original.contrato !== eq.contrato) {
      const oldCt = data.contratos.find(c => c.id === original.contrato);
      if (oldCt) await db.from('contratos').update({ equipos: (oldCt.equipos||[]).filter(x => x !== eq.id) }).eq('id', original.contrato);
    }
    if (eq.contrato && eq.contrato !== original?.contrato) {
      const newCt = data.contratos.find(c => c.id === eq.contrato);
      if (newCt) await db.from('contratos').update({ equipos: [...(newCt.equipos||[]), eq.id] }).eq('id', eq.contrato);
    }
    const { error } = await db.from('equipos').update({
      nombre: eq.nombre, codigo: eq.codigo, ubicacion: eq.ubicacion || null,
      categoria: eq.categoria, estado: eq.estado, proveedor: eq.proveedor || null,
      ultimo_mtto: eq.ultimoMtto || null, proximo_mtto: eq.proximoMtto || null,
      contrato: eq.contrato || null,
    }).eq('id', eq.id);
    if (error) { showNotif('Error: ' + error.message, 'error'); return; }
    setModal(null); showNotif('Equipo actualizado'); loadData();
  };

  const deleteEquipo = async (id) => {
    const eq = data.equipos.find(e => e.id === id);
    if (eq?.contrato) {
      const ct = data.contratos.find(c => c.id === eq.contrato);
      if (ct) await db.from('contratos').update({ equipos: (ct.equipos||[]).filter(x => x !== id) }).eq('id', eq.contrato);
    }
    const { error } = await db.from('equipos').delete().eq('id', id);
    if (error) { showNotif('Error: ' + error.message, 'error'); return; }
    showNotif('Equipo eliminado', 'info'); loadData();
  };

  // ── CRUD Reportes ────────────────────────────────────────────────
  const addReporte = async (r) => {
    let archivo_url = null;
    const archivo_nombre = r.archivo?.name || 'reporte.pdf';
    // Subir PDF a Supabase Storage
    if (r.archivo) {
      const path = `${r.contrato}/${Date.now()}_${r.archivo.name.replace(/\s/g,'_')}`;
      const { error: upErr } = await db.storage.from('reportes-pdf').upload(path, r.archivo);
      if (!upErr) {
        const { data: urlData } = db.storage.from('reportes-pdf').getPublicUrl(path);
        archivo_url = urlData.publicUrl;
      } else {
        showNotif('Advertencia: el PDF no pudo subirse al storage, pero el reporte se guardará.', 'info');
      }
    }
    const prov = data.contratos.find(c => c.id === r.contrato)?.proveedor || '';
    const { error } = await db.from('reportes').insert({
      id: newId('R'), contrato: r.contrato, equipo: r.equipo,
      proveedor: prov, fecha: r.fecha, tipo: r.tipo,
      estado: 'Pendiente revisión', archivo: archivo_nombre,
      archivo_url, notas: r.notas || null,
    });
    if (error) { showNotif('Error: ' + error.message, 'error'); return; }
    setModal(null); showNotif('Reporte cargado y guardado ✓'); loadData();
  };

  const aprobarReporte = async (id) => {
    const { error } = await db.from('reportes').update({ estado: 'Aprobado' }).eq('id', id);
    if (error) { showNotif('Error: ' + error.message, 'error'); return; }
    showNotif('Reporte aprobado'); loadData();
  };

  // ── CRUD Observaciones ────────────────────────────────────────────
  const addObservacion = async (obs) => {
    const { error } = await db.from('observaciones').insert({
      id: newId('O'), equipo: obs.equipo, reporte: obs.reporte || null,
      autor: obs.autor, fecha: new Date().toISOString().split('T')[0],
      texto: obs.texto, tipo: obs.tipo || 'Comentario',
    });
    if (error) { showNotif('Error: ' + error.message, 'error'); return; }
    setModal(null); showNotif('Observación registrada'); loadData();
  };

  // ── Render ───────────────────────────────────────────────────────
  if (loading) return (
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16,background:'var(--bg0)'}}>
      <div className="spinner"></div>
      <p style={{color:'var(--text2)',fontSize:14}}>Conectando con la base de datos...</p>
      <p style={{color:'var(--text3)',fontSize:12}}>MttoGest · Supabase</p>
    </div>
  );

  const navItems = [
    {id:'dashboard',label:'Panel principal',icon:'ti-layout-dashboard'},
    {id:'equipos',label:'Equipos',icon:'ti-tool'},
    {id:'contratos',label:'Contratos',icon:'ti-file-text'},
    {id:'reportes',label:'Reportes de Mtto',icon:'ti-clipboard-list'},
    {id:'observaciones',label:'Observaciones',icon:'ti-message-2'},
    {id:'drive',label:'Archivos / Storage',icon:'ti-database'},
  ];
  const topTitles = {dashboard:'Panel de Control',equipos:'Gestión de Equipos',contratos:'Contratos de Mantenimiento',reportes:'Reportes de Mantenimiento',observaciones:'Observaciones y Novedades',drive:'Archivos y Storage'};

  const views = {
    dashboard:     <Dashboard data={data} setView={setView}/>,
    equipos:       <Equipos data={data} search={search} setSearch={setSearch} filterChip={filterChip} setFilterChip={setFilterChip} setModal={setModal} deleteEquipo={deleteEquipo}/>,
    reportes:      <Reportes data={data} setModal={setModal} aprobarReporte={aprobarReporte}/>,
    contratos:     <Contratos data={data}/>,
    observaciones: <Observaciones data={data} setModal={setModal}/>,
    drive:         <DriveView data={data}/>,
  };

  const pendientes = data.reportes.filter(r => r.estado === 'Pendiente revisión').length;
  const alertas    = data.observaciones.filter(o => o.tipo === 'Alerta').length;

  return (
    <div className="app">
      <aside className="sidebar">
        <div className="sidebar-logo">
          <h1><i className="ti ti-settings-2" style={{marginRight:6}}></i>MttoGest</h1>
          <p>Gestión de Contratos · Live</p>
        </div>
        <nav className="sidebar-nav">
          <div className="nav-section">Módulos</div>
          {navItems.map(n => (
            <div key={n.id} className={`nav-item${view===n.id?' active':''}`} onClick={() => setView(n.id)}>
              <i className={`ti ${n.icon}`}></i>
              <span>{n.label}</span>
              {n.id==='reportes' && pendientes>0 && <span className="badge badge-amber" style={{marginLeft:'auto',padding:'2px 7px',fontSize:10}}>{pendientes}</span>}
              {n.id==='observaciones' && alertas>0  && <span className="badge badge-red"   style={{marginLeft:'auto',padding:'2px 7px',fontSize:10}}>{alertas}</span>}
            </div>
          ))}
        </nav>
        <div className="sidebar-footer">
          <div className="drive-status">
            <div className="drive-dot"></div>
            <div>
              <p style={{fontSize:11,fontWeight:600,color:'#e2e8f0'}}>Supabase · Conectado</p>
              <span style={{fontSize:10,color:'var(--text3)'}}>{data.equipos.length} equipos · {data.reportes.length} reportes</span>
            </div>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="topbar-title">{topTitles[view]}</div>
          <div className="topbar-right">
            {view==='reportes'      && <button className="btn btn-primary btn-sm" onClick={() => setModal('upload-reporte')}><i className="ti ti-upload"></i> Cargar reporte</button>}
            {view==='equipos'       && <button className="btn btn-primary btn-sm" onClick={() => setModal('add-equipo')}><i className="ti ti-plus"></i> Nuevo equipo</button>}
            {view==='observaciones' && <button className="btn btn-primary btn-sm" onClick={() => setModal('add-obs')}><i className="ti ti-plus"></i> Nueva observación</button>}
            <button className="btn-icon" onClick={loadData} title="Recargar datos"><i className="ti ti-refresh"></i></button>
            <div className="avatar" style={{background:'rgba(59,130,246,.2)',color:'var(--accent2)'}}>JM</div>
          </div>
        </div>
        <div className="content">{views[view]}</div>
      </main>

      {modal==='upload-reporte'           && <ModalUpload   data={data} onClose={()=>setModal(null)} onSave={addReporte}/>}
      {modal==='add-equipo'               && <ModalEquipo   data={data} onClose={()=>setModal(null)} onSave={addEquipo}/>}
      {modal?.type==='edit-equipo'        && <ModalEquipo   data={data} equipo={modal.equipo} onClose={()=>setModal(null)} onSave={updateEquipo}/>}
      {modal==='add-obs'                  && <ModalObs      data={data} onClose={()=>setModal(null)} onSave={addObservacion}/>}
      {modal?.type==='view-reporte'       && <ModalViewReporte reporte={modal.reporte} data={data} onClose={()=>setModal(null)} onAprobar={aprobarReporte} onObs={addObservacion}/>}

      {notif && (
        <div className="notification">
          <div className="notif-icon" style={{background:notif.type==='success'?'rgba(16,185,129,.2)':notif.type==='error'?'rgba(239,68,68,.2)':'rgba(59,130,246,.2)'}}>
            <i className={`ti ${notif.type==='success'?'ti-check':notif.type==='error'?'ti-alert-circle':'ti-info-circle'}`} style={{color:notif.type==='success'?'var(--green2)':notif.type==='error'?'var(--red2)':'var(--accent2)'}}></i>
          </div>
          <p style={{fontSize:13,fontWeight:500,color:'var(--text1)',flex:1}}>{notif.msg}</p>
          <i className="ti ti-x" style={{color:'var(--text3)',cursor:'pointer'}} onClick={()=>setNotif(null)}></i>
        </div>
      )}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({ data, setView }) {
  const pendientes = data.reportes.filter(r => r.estado==='Pendiente revisión').length;
  const alertas    = data.observaciones.filter(o => o.tipo==='Alerta').length;
  const enMtto     = data.equipos.filter(e => e.estado==='En mantenimiento').length;
  const alerta     = data.equipos.filter(e => e.estado==='Alerta').length;
  const prox       = data.equipos.filter(e => e.proximoMtto).sort((a,b) => new Date(a.proximoMtto)-new Date(b.proximoMtto)).slice(0,5);
  const ultObs     = data.observaciones.slice(0,4);
  const cats       = ['Neumático','Izaje','Eléctrico','HVAC','Vapor','Mecánico'];

  return (
    <div>
      <div className="grid-4">
        <StatCard label="Equipos operativos" value={data.equipos.filter(e=>e.estado==='Operativo').length} sub={`de ${data.equipos.length} equipos`} icon="ti-tool" iconBg="rgba(59,130,246,.15)" iconColor="var(--accent2)" trend={`${enMtto} en mantenimiento`} trendUp={enMtto===0}/>
        <StatCard label="Reportes pendientes" value={pendientes} sub="esperan revisión" icon="ti-clipboard-list" iconBg="rgba(245,158,11,.15)" iconColor="var(--amber2)" trend={pendientes>0?'Requieren atención':'Al día'} trendUp={pendientes===0}/>
        <StatCard label="Contratos activos" value={data.contratos.filter(c=>c.estado==='Activo').length} sub={`${fmtValor(data.contratos.reduce((s,c)=>s+(c.valor||0),0))} en contratos`} icon="ti-file-text" iconBg="rgba(139,92,246,.15)" iconColor="var(--purple2)" trend="Todos vigentes" trendUp={true}/>
        <StatCard label="Alertas abiertas" value={alertas+alerta} sub={`${data.observaciones.length} observaciones total`} icon="ti-alert-triangle" iconBg="rgba(239,68,68,.15)" iconColor="var(--red2)" trend={alertas>0?'Requieren atención':'Sin alertas'} trendUp={alertas===0}/>
      </div>

      <div className="grid-2" style={{marginBottom:24}}>
        <div className="card">
          <div className="card-header">
            <span className="card-title"><i className="ti ti-calendar-clock" style={{marginRight:6}}></i>Próximos mantenimientos</span>
            <button className="btn btn-secondary btn-sm" onClick={()=>setView('equipos')}>Ver todos</button>
          </div>
          {prox.length === 0 ? <div className="empty-state"><i className="ti ti-calendar"></i><p>No hay mantenimientos programados</p></div> : (
            <table className="table">
              <thead><tr><th>Equipo</th><th>Fecha</th><th>Estado</th></tr></thead>
              <tbody>
                {prox.map(e => {
                  const d = diasHasta(e.proximoMtto);
                  return (
                    <tr key={e.id}>
                      <td><span className="mono">{e.codigo}</span><br/><span style={{fontSize:11,color:'var(--text3)'}}>{e.nombre.substring(0,28)}</span></td>
                      <td style={{fontSize:12}}>{e.proximoMtto}</td>
                      <td><span className={`badge ${d<0?'badge-red':d<30?'badge-amber':'badge-green'}`}>{d<0?'Vencido':d<30?`${d}d`:'OK'}</span></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          )}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title"><i className="ti ti-message-2" style={{marginRight:6}}></i>Últimas observaciones</span></div>
          {ultObs.length===0 ? <div className="empty-state"><i className="ti ti-message-2"></i><p>Sin observaciones</p></div> : ultObs.map(o => {
            const eq = data.equipos.find(e=>e.id===o.equipo);
            return (
              <div key={o.id} className="activity-item">
                <div className="activity-icon" style={{background:o.tipo==='Alerta'?'rgba(239,68,68,.2)':o.tipo==='Aprobación'?'rgba(16,185,129,.2)':'rgba(59,130,246,.2)'}}>
                  <i className={`ti ${o.tipo==='Alerta'?'ti-alert-triangle':o.tipo==='Aprobación'?'ti-check':'ti-message-2'}`} style={{color:o.tipo==='Alerta'?'var(--red2)':o.tipo==='Aprobación'?'var(--green2)':'var(--accent2)'}}></i>
                </div>
                <div className="activity-content">
                  <p>{o.texto.substring(0,60)}{o.texto.length>60?'...':''}</p>
                  <span>{eq?.codigo||o.equipo} · {o.autor} · {o.fecha}</span>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="card">
        <div className="card-header"><span className="card-title"><i className="ti ti-chart-bar" style={{marginRight:6}}></i>Estado de equipos por categoría</span></div>
        <div style={{display:'flex',gap:16,flexWrap:'wrap'}}>
          {cats.map(cat => {
            const eqs   = data.equipos.filter(e=>e.categoria===cat);
            const ok    = eqs.filter(e=>e.estado==='Operativo').length;
            const total = eqs.length;
            if(total===0) return null;
            return (
              <div key={cat} style={{flex:'1 1 120px',background:'var(--bg3)',borderRadius:'var(--radius)',padding:'12px'}}>
                <div style={{fontSize:11,color:'var(--text3)',marginBottom:4}}>{cat}</div>
                <div style={{fontSize:20,fontWeight:700,color:'var(--text1)'}}>{ok}/{total}</div>
                <div className="progress-bar" style={{marginTop:8}}>
                  <div className="progress-fill" style={{width:`${ok/total*100}%`,background:ok===total?'var(--green)':'var(--amber)'}}></div>
                </div>
                <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>operativos</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, sub, icon, iconBg, iconColor, trend, trendUp }) {
  return (
    <div className="stat-card">
      <div className="flex justify-between items-center" style={{marginBottom:10}}>
        <div className="stat-label">{label}</div>
        <div className="stat-icon" style={{background:iconBg}}><i className={`ti ${icon}`} style={{color:iconColor}}></i></div>
      </div>
      <div className="stat-value">{value}</div>
      <div className="stat-sub">{sub}</div>
      {trend && <div className={`stat-trend ${trendUp?'trend-up':'trend-down'}`}><i className={`ti ${trendUp?'ti-trending-up':'ti-alert-circle'}`} style={{fontSize:12}}></i>{trend}</div>}
    </div>
  );
}

// ── Equipos ───────────────────────────────────────────────────────────────────
function Equipos({ data, search, setSearch, filterChip, setFilterChip, setModal, deleteEquipo }) {
  const cats     = ['Todos', ...new Set(data.equipos.map(e=>e.categoria))];
  const filtered = data.equipos.filter(e => {
    const mc = filterChip==='Todos' || e.categoria===filterChip;
    const ms = !search || e.nombre.toLowerCase().includes(search.toLowerCase()) || e.codigo.toLowerCase().includes(search.toLowerCase());
    return mc && ms;
  });
  return (
    <div>
      <div className="flex items-center justify-between mb-16">
        <div className="search-bar">
          <i className="ti ti-search"></i>
          <input placeholder="Buscar nombre o código..." value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <span style={{fontSize:12,color:'var(--text3)'}}>{filtered.length} equipos</span>
      </div>
      <div className="chips">{cats.map(c=><div key={c} className={`chip${filterChip===c?' active':''}`} onClick={()=>setFilterChip(c)}>{c}</div>)}</div>
      <div className="card">
        <table className="table">
          <thead><tr><th>Código</th><th>Nombre / Ubicación</th><th>Categoría</th><th>Estado</th><th>Último Mtto</th><th>Próximo Mtto</th><th>Proveedor</th><th></th></tr></thead>
          <tbody>
            {filtered.map(e => {
              const d = e.proximoMtto ? diasHasta(e.proximoMtto) : 999;
              return (
                <tr key={e.id}>
                  <td><span className="mono">{e.codigo}</span></td>
                  <td><div style={{fontWeight:500,color:'var(--text1)',fontSize:13}}>{e.nombre}</div><div style={{fontSize:11,color:'var(--text3)'}}><i className="ti ti-map-pin" style={{fontSize:11}}></i> {e.ubicacion}</div></td>
                  <td><span className="badge badge-blue">{e.categoria}</span></td>
                  <td><span className={`status-dot dot-${e.estado==='Operativo'?'green':e.estado==='Alerta'?'amber':'blue'}`}></span>{e.estado}</td>
                  <td style={{fontSize:12}}>{e.ultimoMtto||'—'}</td>
                  <td>{e.proximoMtto?<span className={`badge ${d<0?'badge-red':d<30?'badge-amber':'badge-green'}`}>{e.proximoMtto}</span>:'—'}</td>
                  <td style={{fontSize:12,color:'var(--text3)'}}>{e.proveedor||'—'}</td>
                  <td>
                    <div className="flex gap-8">
                      <button className="btn-icon" onClick={()=>setModal({type:'edit-equipo',equipo:e})}><i className="ti ti-edit"></i></button>
                      <button className="btn-icon" style={{borderColor:'rgba(239,68,68,.3)',color:'var(--red2)'}} onClick={()=>{ if(confirm(`¿Eliminar ${e.nombre}?`)) deleteEquipo(e.id); }}><i className="ti ti-trash"></i></button>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {filtered.length===0 && <div className="empty-state"><i className="ti ti-tool"></i><p>No se encontraron equipos</p></div>}
      </div>
    </div>
  );
}

// ── Reportes ──────────────────────────────────────────────────────────────────
function Reportes({ data, setModal, aprobarReporte }) {
  const [filter, setFilter] = useState('Todos');
  const estados = ['Todos','Pendiente revisión','Aprobado'];
  const filtered = data.reportes.filter(r => filter==='Todos' || r.estado===filter);
  return (
    <div>
      <div className="chips">
        {estados.map(e => (
          <div key={e} className={`chip${filter===e?' active':''}`} onClick={()=>setFilter(e)}>
            {e}{e==='Pendiente revisión' && data.reportes.filter(r=>r.estado==='Pendiente revisión').length>0 &&
              <span style={{marginLeft:4,background:'var(--amber)',color:'#fff',borderRadius:10,padding:'1px 6px',fontSize:10}}>{data.reportes.filter(r=>r.estado==='Pendiente revisión').length}</span>}
          </div>
        ))}
      </div>
      <div className="card">
        <table className="table">
          <thead><tr><th>ID</th><th>Equipo</th><th>Proveedor</th><th>Fecha</th><th>Tipo</th><th>Archivo</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {filtered.map(r => {
              const eq = data.equipos.find(e=>e.id===r.equipo);
              return (
                <tr key={r.id}>
                  <td><span className="mono">{r.id}</span></td>
                  <td><div style={{fontWeight:500,color:'var(--text1)',fontSize:13}}>{eq?.nombre?.substring(0,24)||r.equipo}</div><div style={{fontSize:11,color:'var(--text3)'}}>{eq?.codigo}</div></td>
                  <td style={{fontSize:12}}>{r.proveedor}</td>
                  <td style={{fontSize:12}}>{r.fecha}</td>
                  <td><span className={`badge ${r.tipo==='Preventivo'?'badge-blue':'badge-red'}`}>{r.tipo}</span></td>
                  <td>
                    <div className="flex items-center gap-8">
                      <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:16}}></i>
                      {r.archivoUrl
                        ? <a href={r.archivoUrl} target="_blank" rel="noreferrer" style={{fontSize:12,color:'var(--accent3)',textDecoration:'none'}}>{r.archivo}</a>
                        : <span style={{fontSize:12,color:'var(--text3)'}}>{r.archivo||'Sin archivo'}</span>}
                    </div>
                  </td>
                  <td><span className={`badge ${r.estado==='Aprobado'?'badge-green':'badge-amber'}`}>{r.estado}</span></td>
                  <td>
                    <div className="flex gap-8">
                      <button className="btn-icon" onClick={()=>setModal({type:'view-reporte',reporte:r})}><i className="ti ti-eye"></i></button>
                      {r.estado!=='Aprobado' && <button className="btn-icon" style={{borderColor:'rgba(16,185,129,.3)',color:'var(--green2)'}} onClick={()=>aprobarReporte(r.id)}><i className="ti ti-check"></i></button>}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {filtered.length===0 && <div className="empty-state"><i className="ti ti-clipboard-list"></i><p>No hay reportes</p></div>}
      </div>
    </div>
  );
}

// ── Contratos ─────────────────────────────────────────────────────────────────
function Contratos({ data }) {
  if(data.contratos.length===0) return <div className="empty-state"><i className="ti ti-file-text"></i><p>No hay contratos registrados</p></div>;
  return (
    <div className="grid-2">
      {data.contratos.map(c => {
        const eqs = data.equipos.filter(e => (c.equipos||[]).includes(e.id));
        const d   = diasHasta(c.fin);
        return (
          <div key={c.id} className="card">
            <div className="flex justify-between items-center" style={{marginBottom:12}}>
              <div><div style={{fontWeight:700,fontSize:14,color:'var(--text1)'}}>{c.nombre}</div><div style={{fontSize:11,color:'var(--text3)',marginTop:2,fontFamily:'monospace'}}>{c.id}</div></div>
              <span className={`badge ${c.estado==='Activo'?'badge-green':'badge-gray'}`}>{c.estado}</span>
            </div>
            <div className="divider" style={{margin:'10px 0'}}></div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:12}}>
              <div><div style={{color:'var(--text3)',fontSize:11}}>Proveedor</div><div style={{color:'var(--text1)',fontWeight:500}}>{c.proveedor}</div></div>
              <div><div style={{color:'var(--text3)',fontSize:11}}>Tipo</div><div style={{color:'var(--text1)'}}>{c.tipo}</div></div>
              <div><div style={{color:'var(--text3)',fontSize:11}}>Vigencia</div><div style={{color:'var(--text1)'}}>{c.inicio} → {c.fin}</div></div>
              <div><div style={{color:'var(--text3)',fontSize:11}}>Valor anual</div><div style={{color:'var(--green2)',fontWeight:700}}>{c.valor?fmtValor(c.valor):'—'}</div></div>
            </div>
            <div className="divider" style={{margin:'10px 0'}}></div>
            <div style={{marginBottom:10}}>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>Equipos cubiertos</div>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                {eqs.length>0 ? eqs.map(e=><span key={e.id} className="badge badge-blue">{e.codigo}</span>) : <span style={{fontSize:11,color:'var(--text3)'}}>Sin equipos asignados</span>}
              </div>
            </div>
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-8">
                <i className="ti ti-database" style={{color:'var(--green2)',fontSize:16}}></i>
                <span style={{fontSize:11,color:'var(--text3)'}}>{data.reportes.filter(r=>r.contrato===c.id).length} reportes</span>
              </div>
              <span className={`badge ${d<0?'badge-red':d<60?'badge-amber':'badge-green'}`}>{d<0?'Vencido':`${d}d restantes`}</span>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Observaciones ─────────────────────────────────────────────────────────────
function Observaciones({ data, setModal }) {
  const [filter, setFilter] = useState('Todos');

  return (
    <div>
      <div className="chips">{tipos.map(t=><div key={t} className={`chip${filter===t?' active':''}`} onClick={()=>setFilter(t)}>{t}</div>)}</div>
      {filtered.length===0 && <div className="empty-state"><i className="ti ti-message-2"></i><p>No hay observaciones</p></div>}
      {filtered.map(o => {
        const eq = data.equipos.find(e=>e.id===o.equipo);
        return (
          <div key={o.id} className="obs-item" style={{borderLeftColor:o.tipo==='Alerta'?'var(--red)':o.tipo==='Aprobación'?'var(--green)':'var(--accent)'}}>
            <div className="obs-header">
              <div className="flex items-center gap-8">
                <span className={`badge ${o.tipo==='Alerta'?'badge-red':o.tipo==='Aprobación'?'badge-green':'badge-blue'}`}>{o.tipo}</span>
                <span className="obs-author">{o.autor}</span>
              </div>
              <span className="obs-date">{o.fecha}</span>
            </div>
            <div className="obs-text">{o.texto}</div>
            <div className="obs-equipo">
              <i className="ti ti-tool" style={{fontSize:11,marginRight:4}}></i>
              {eq?.nombre||o.equipo} {eq?`(${eq.codigo})`:''}
              {o.reporte && <> · <i className="ti ti-clipboard-list" style={{fontSize:11,marginRight:4}}></i>Reporte {o.reporte}</>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Drive / Storage View ──────────────────────────────────────────────────────
function DriveView({ data }) {
  const [files, setFiles]       = useState([]);
  const [loadingF, setLoadingF] = useState(true);
  const [expanded, setExpanded] = useState({});

  useEffect(() => {
    db.storage.from('reportes-pdf').list('', { limit:100 })
      .then(({ data: d }) => { setFiles(d||[]); setLoadingF(false); })
      .catch(() => setLoadingF(false));
  }, []);

  const toggle = k => setExpanded(e => ({...e,[k]:!e[k]}));
  const totalSize = files.reduce((s,f) => s+(f.metadata?.size||0), 0);

  return (
    <div className="grid-2">
      <div className="card">
        <div className="card-header"><span className="card-title"><i className="ti ti-database" style={{marginRight:6,color:'var(--green2)'}}></i>Estructura por contrato</span></div>
        <div className="drive-tree">
          <div className="drive-folder" style={{cursor:'default'}}>
            <i className="ti ti-folder" style={{color:'var(--accent2)'}}></i>
            <span style={{fontWeight:600,color:'var(--text1)'}}>reportes-pdf (Supabase Storage)</span>
          </div>
          {data.contratos.map(c => (
            <div key={c.id} className="drive-subfolder">
              <div className="drive-folder" onClick={()=>toggle(c.id)}>
                <i className={`ti ${expanded[c.id]?'ti-folder-open':'ti-folder'}`}></i>
                <span>{c.id} · {c.proveedor}</span>
                <i className={`ti ${expanded[c.id]?'ti-chevron-down':'ti-chevron-right'}`} style={{marginLeft:'auto',fontSize:12,color:'var(--text3)'}}></i>
              </div>
              {expanded[c.id] && (
                <div className="drive-subfolder">
                  {data.reportes.filter(r=>r.contrato===c.id).map(r => (
                    <div key={r.id} className="drive-folder">
                      <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:14}}></i>
                      {r.archivoUrl
                        ? <a href={r.archivoUrl} target="_blank" rel="noreferrer" style={{fontSize:12,color:'var(--accent3)',textDecoration:'none'}}>{r.archivo}</a>
                        : <span style={{fontSize:12,color:'var(--text3)'}}>{r.archivo}</span>}
                      <span className={`badge ${r.estado==='Aprobado'?'badge-green':'badge-amber'}`} style={{marginLeft:'auto',fontSize:9,padding:'1px 6px'}}>{r.estado}</span>
                    </div>
                  ))}
                  {data.reportes.filter(r=>r.contrato===c.id).length===0 && <div style={{fontSize:11,color:'var(--text3)',padding:'4px 8px'}}>Sin reportes aún</div>}
                </div>
              )}
            </div>
          ))}
        </div>
      </div>
      <div>
        <div className="card" style={{marginBottom:16}}>
          <div className="card-header"><span className="card-title">Estado del Storage</span></div>
          <div style={{display:'grid',gap:8}}>
            {[
              {label:'Archivos guardados',     val:loadingF?'...':`${files.length} PDFs`,      icon:'ti-files',    c:'var(--accent2)'},
              {label:'Espacio utilizado',      val:loadingF?'...':totalSize>0?`${(totalSize/1024).toFixed(0)} KB`:'0 KB', icon:'ti-database',c:'var(--purple2)'},
              {label:'Reportes pendientes',    val:data.reportes.filter(r=>r.estado==='Pendiente revisión').length, icon:'ti-clock',    c:'var(--amber2)'},
              {label:'Reportes aprobados',     val:data.reportes.filter(r=>r.estado==='Aprobado').length,           icon:'ti-check',    c:'var(--green2)'},
            ].map(s => (
              <div key={s.label} className="flex items-center gap-8" style={{padding:'8px 10px',background:'var(--bg3)',borderRadius:'var(--radius)'}}>
                <i className={`ti ${s.icon}`} style={{color:s.c,fontSize:16,width:18}}></i>
                <span style={{fontSize:12,color:'var(--text2)',flex:1}}>{s.label}</span>
                <span style={{fontSize:12,fontWeight:500,color:'var(--text1)'}}>{s.val}</span>
              </div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Archivos recientes en Storage</span></div>
          {loadingF ? <div style={{textAlign:'center',padding:20}}><div className="spinner" style={{margin:'0 auto'}}></div></div> :
           files.length===0 ? <div className="empty-state"><i className="ti ti-files"></i><p>No hay archivos aún</p><span>Carga el primer reporte</span></div> :
           files.slice(0,6).map(f => (
            <div key={f.name} className="flex items-center gap-8" style={{padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:16}}></i>
              <span style={{fontSize:12,color:'var(--text2)',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</span>
              <span style={{fontSize:11,color:'var(--text3)'}}>{f.metadata?.size?`${(f.metadata.size/1024).toFixed(0)}KB`:''}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── Modal Upload Reporte ──────────────────────────────────────────────────────
function ModalUpload({ data, onClose, onSave }) {
  const [form, setForm]     = useState({ contrato:'', equipo:'', fecha:new Date().toISOString().split('T')[0], tipo:'Preventivo', archivo:null, notas:'' });
  const [progress, setP]    = useState(0);
  const [uploading, setUpl] = useState(false);
  const [uploaded, setDone] = useState(false);
  const [drag, setDrag]     = useState(false);
  const fileRef = useRef();

  const contrato    = data.contratos.find(c=>c.id===form.contrato);
  const equiposDisp = contrato ? data.equipos.filter(e=>(contrato.equipos||[]).includes(e.id)) : [];

  const handleFile = (file) => {
    if (!file) return;
    setForm(f=>({...f, archivo:file}));
    setUpl(true); setP(0);
    let p = 0;
    const iv = setInterval(() => {
      p += Math.random()*30;
      if(p>=100){ p=100; clearInterval(iv); setUpl(false); setDone(true); }
      setP(Math.min(p,100));
    }, 200);
  };

  const submit = () => {
    if(!form.contrato||!form.equipo||!form.archivo) return;
    onSave(form);
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <div className="flex items-center gap-8"><i className="ti ti-upload" style={{color:'var(--accent2)',fontSize:18}}></i><span style={{fontWeight:600,color:'var(--text1)'}}>Cargar Reporte de Mantenimiento</span></div>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">
          <div className="two-col">
            <div className="input-group">
              <label className="input-label">Contrato *</label>
              <select className="select" value={form.contrato} onChange={e=>setForm(f=>({...f,contrato:e.target.value,equipo:''}))}>
                <option value="">Seleccionar...</option>
                {data.contratos.map(c=><option key={c.id} value={c.id}>{c.id} · {c.proveedor}</option>)}
              </select>
            </div>
            <div className="input-group">
              <label className="input-label">Equipo *</label>
              <select className="select" value={form.equipo} onChange={e=>setForm(f=>({...f,equipo:e.target.value}))} disabled={!form.contrato}>
                <option value="">Seleccionar...</option>
                {equiposDisp.map(e=><option key={e.id} value={e.id}>{e.codigo} · {e.nombre.substring(0,25)}</option>)}
              </select>
            </div>
          </div>
          <div className="two-col">
            <div className="input-group">
              <label className="input-label">Fecha del servicio *</label>
              <input type="date" className="input" value={form.fecha} onChange={e=>setForm(f=>({...f,fecha:e.target.value}))}/>
            </div>
            <div className="input-group">
              <label className="input-label">Tipo</label>
              <select className="select" value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                <option>Preventivo</option><option>Correctivo</option><option>Predictivo</option><option>Lubricación</option>
              </select>
            </div>
          </div>
          <div className="input-group">
            <label className="input-label">Archivo PDF *</label>
            <div className={`upload-zone${drag?' drag':''}`}
              onClick={()=>fileRef.current.click()}
              onDragOver={e=>{e.preventDefault();setDrag(true)}}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{e.preventDefault();setDrag(false);handleFile(e.dataTransfer.files[0])}}>
              <input ref={fileRef} type="file" accept=".pdf,.doc,.docx" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
              {!form.archivo ? <>
                <i className="ti ti-cloud-upload"></i>
                <p>Arrastra el PDF aquí o haz clic para seleccionar</p>
                <span>PDF hasta 20MB · Se guardará en Supabase Storage</span>
              </> : (
                <div className="file-item" style={{textAlign:'left'}}>
                  <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:22}}></i>
                  <div className="file-info">
                    <p>{form.archivo.name}</p>
                    <span>{(form.archivo.size/1024).toFixed(1)} KB</span>
                    {uploading && <div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}></div></div>}
                    {uploaded  && <div style={{fontSize:11,color:'var(--green2)',marginTop:4}}><i className="ti ti-check" style={{fontSize:11}}></i> Listo para guardar</div>}
                  </div>
                  {uploaded && <i className="ti ti-check" style={{color:'var(--green2)',fontSize:18}}></i>}
                </div>
              )}
            </div>
          </div>
          <div className="input-group">
            <label className="input-label">Observaciones del servicio</label>
            <textarea className="textarea" placeholder="Trabajos realizados, hallazgos, materiales, recomendaciones..." value={form.notas} onChange={e=>setForm(f=>({...f,notas:e.target.value}))}></textarea>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={submit} disabled={!form.contrato||!form.equipo||!form.archivo}><i className="ti ti-upload"></i> Guardar reporte</button>
        </div>
      </div>
    </div>
  );
}

// ── Modal Equipo ──────────────────────────────────────────────────────────────
function ModalEquipo({ data, equipo, onClose, onSave }) {
  const [form, setForm] = useState(equipo || { nombre:'', codigo:'', ubicacion:'', categoria:'Mecánico', estado:'Operativo', proveedor:'', ultimoMtto:'', proximoMtto:'', contrato:'' });
  const set = (k,v) => setForm(f=>({...f,[k]:v}));
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span style={{fontWeight:600,color:'var(--text1)'}}><i className="ti ti-tool" style={{marginRight:8,color:'var(--accent2)'}}></i>{equipo?'Editar equipo':'Nuevo equipo'}</span>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">
          <div className="two-col">
            <div className="input-group"><label className="input-label">Nombre *</label><input className="input" value={form.nombre} onChange={e=>set('nombre',e.target.value)} placeholder="Compresor Atlas Copco"/></div>
            <div className="input-group"><label className="input-label">Código *</label><input className="input" value={form.codigo} onChange={e=>set('codigo',e.target.value)} placeholder="COMP-001" style={{fontFamily:'monospace'}}/></div>
          </div>
          <div className="input-group"><label className="input-label">Ubicación</label><input className="input" value={form.ubicacion||''} onChange={e=>set('ubicacion',e.target.value)} placeholder="Planta / Área / Sala"/></div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Categoría</label>
              <select className="select" value={form.categoria} onChange={e=>set('categoria',e.target.value)}>
                {['Mecánico','Neumático','Hidráulico','Eléctrico','HVAC','Vapor','Izaje','Electrónico'].map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="input-group"><label className="input-label">Estado</label>
              <select className="select" value={form.estado} onChange={e=>set('estado',e.target.value)}>
                {['Operativo','En mantenimiento','Alerta','Fuera de servicio'].map(s=><option key={s}>{s}</option>)}
              </select>
            </div>
          </div>
          <div className="input-group"><label className="input-label">Proveedor asignado</label>
            <select className="select" value={form.proveedor||''} onChange={e=>set('proveedor',e.target.value)}>
              <option value="">Sin asignar</option>
              {data.proveedores.map(p=><option key={p.id} value={p.nombre}>{p.nombre}</option>)}
            </select>
          </div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Último mantenimiento</label><input type="date" className="input" value={form.ultimoMtto||''} onChange={e=>set('ultimoMtto',e.target.value)}/></div>
            <div className="input-group"><label className="input-label">Próximo mantenimiento</label><input type="date" className="input" value={form.proximoMtto||''} onChange={e=>set('proximoMtto',e.target.value)}/></div>
          </div>
          <div className="input-group"><label className="input-label">Contrato vinculado</label>
            <select className="select" value={form.contrato||''} onChange={e=>set('contrato',e.target.value)}>
              <option value="">Sin contrato</option>
              {data.contratos.map(c=><option key={c.id} value={c.id}>{c.id} · {c.nombre.substring(0,35)}</option>)}
            </select>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={()=>onSave(form)} disabled={!form.nombre||!form.codigo}><i className="ti ti-check"></i> {equipo?'Guardar cambios':'Agregar equipo'}</button>
        </div>
      </div>
    </div>
  );
}

// ── Modal Observación ─────────────────────────────────────────────────────────
function ModalObs({ data, onClose, onSave }) {
  const [form, setForm] = useState({ equipo:'', reporte:null, autor:'', texto:'', tipo:'Comentario' });
  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span style={{fontWeight:600,color:'var(--text1)'}}><i className="ti ti-message-2" style={{marginRight:8,color:'var(--accent2)'}}></i>Nueva Observación</span>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">
          <div className="two-col">
            <div className="input-group"><label className="input-label">Equipo *</label>
              <select className="select" value={form.equipo} onChange={e=>setForm(f=>({...f,equipo:e.target.value}))}>
                <option value="">Seleccionar...</option>
                {data.equipos.map(e=><option key={e.id} value={e.id}>{e.codigo} · {e.nombre.substring(0,20)}</option>)}
              </select>
            </div>
            <div className="input-group"><label className="input-label">Reporte asociado</label>
              <select className="select" value={form.reporte||''} onChange={e=>setForm(f=>({...f,reporte:e.target.value||null}))}>
                <option value="">Sin reporte</option>
                {data.reportes.filter(r=>!form.equipo||r.equipo===form.equipo).map(r=><option key={r.id} value={r.id}>{r.id} · {r.fecha}</option>)}
              </select>
            </div>
          </div>
          <div className="two-col">
            <div className="input-group"><label className="input-label">Autor *</label><input className="input" value={form.autor} onChange={e=>setForm(f=>({...f,autor:e.target.value}))} placeholder="Nombre y cargo"/></div>
            <div className="input-group"><label className="input-label">Tipo</label>
              <select className="select" value={form.tipo} onChange={e=>setForm(f=>({...f,tipo:e.target.value}))}>
                {['Alerta','Aprobación','Comentario','Seguimiento','Solicitud'].map(t=><option key={t}>{t}</option>)}
              </select>
            </div>
          </div>
          <div className="input-group"><label className="input-label">Observación *</label>
            <textarea className="textarea" style={{minHeight:100}} placeholder="Describe detalladamente la observación..." value={form.texto} onChange={e=>setForm(f=>({...f,texto:e.target.value}))}></textarea>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={()=>onSave(form)} disabled={!form.equipo||!form.autor||!form.texto}><i className="ti ti-check"></i> Registrar</button>
        </div>
      </div>
    </div>
  );
}

// ── Modal Ver Reporte ─────────────────────────────────────────────────────────
function ModalViewReporte({ reporte, data, onClose, onAprobar, onObs }) {
  const eq      = data.equipos.find(e=>e.id===reporte.equipo);
  const obsRel  = data.observaciones.filter(o=>o.reporte===reporte.id);
  const [autor, setAutor]   = useState('');
  const [texto, setTexto]   = useState('');
  const [tipo,  setTipo]    = useState('Comentario');

  const guardarObs = () => {
    if(!texto||!autor) return;
    onObs({ equipo:reporte.equipo, reporte:reporte.id, autor, texto, tipo });
    setTexto(''); setAutor('');
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{maxWidth:560}}>
        <div className="modal-header">
          <div className="flex items-center gap-8">
            <i className="ti ti-clipboard-list" style={{color:'var(--accent2)',fontSize:18}}></i>
            <span style={{fontWeight:600,color:'var(--text1)'}}>Reporte {reporte.id}</span>
            <span className={`badge ${reporte.estado==='Aprobado'?'badge-green':'badge-amber'}`}>{reporte.estado}</span>
          </div>
          <button className="btn-icon" onClick={onClose}><i className="ti ti-x"></i></button>
        </div>
        <div className="modal-body">
          <div style={{background:'var(--bg3)',borderRadius:'var(--radius)',padding:'12px',marginBottom:14}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,fontSize:12}}>
              <div><span style={{color:'var(--text3)'}}>Equipo:</span> <span style={{fontWeight:500,color:'var(--text1)'}}>{eq?.nombre}</span></div>
              <div><span style={{color:'var(--text3)'}}>Código:</span> <span style={{fontFamily:'monospace',color:'var(--accent3)'}}>{eq?.codigo}</span></div>
              <div><span style={{color:'var(--text3)'}}>Proveedor:</span> <span style={{color:'var(--text1)'}}>{reporte.proveedor}</span></div>
              <div><span style={{color:'var(--text3)'}}>Fecha:</span> <span style={{color:'var(--text1)'}}>{reporte.fecha}</span></div>
              <div><span style={{color:'var(--text3)'}}>Tipo:</span> <span className={`badge ${reporte.tipo==='Preventivo'?'badge-blue':'badge-red'}`}>{reporte.tipo}</span></div>
              <div><span style={{color:'var(--text3)'}}>Contrato:</span> <span style={{fontFamily:'monospace',fontSize:11}}>{reporte.contrato}</span></div>
            </div>
          </div>
          {/* PDF */}
          <div style={{marginBottom:14}}>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Archivo</div>
            <div className="flex items-center gap-8" style={{padding:'10px 12px',background:'var(--bg3)',borderRadius:'var(--radius)',border:'1px solid var(--border)'}}>
              <i className="ti ti-file-type-pdf" style={{color:'var(--red2)',fontSize:20}}></i>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:500,color:'var(--text1)'}}>{reporte.archivo||'Sin archivo'}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>Supabase Storage · reportes-pdf</div>
              </div>
              {reporte.archivoUrl
                ? <a href={reporte.archivoUrl} target="_blank" rel="noreferrer" className="btn btn-secondary btn-sm"><i className="ti ti-external-link"></i> Abrir</a>
                : <span style={{fontSize:11,color:'var(--text3)'}}>Sin URL</span>}
            </div>
          </div>
          {/* Notas del servicio */}
          {reporte.notas && (
            <div style={{marginBottom:14}}>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:6}}>Notas del servicio</div>
              <div style={{fontSize:13,color:'var(--text2)',background:'var(--bg3)',borderRadius:'var(--radius)',padding:'10px 12px',borderLeft:'3px solid var(--accent)'}}>{reporte.notas}</div>
            </div>
          )}
          {/* Observaciones vinculadas */}
          {obsRel.length>0 && (
            <div style={{marginBottom:14}}>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Observaciones ({obsRel.length})</div>
              {obsRel.map(o=>(
                <div key={o.id} className="obs-item" style={{borderLeftColor:o.tipo==='Alerta'?'var(--red)':o.tipo==='Aprobación'?'var(--green)':'var(--accent)',marginBottom:8}}>
                  <div className="obs-header">
                    <span className="obs-author">{o.autor}</span>
                    <span className="obs-date">{o.fecha}</span>
                  </div>
                  <div className="obs-text">{o.texto}</div>
                </div>
              ))}
            </div>
          )}
          {/* Agregar observación */}
          <div className="divider"></div>
          <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Agregar observación</div>
          <div className="two-col" style={{marginBottom:8}}>
            <input className="input" placeholder="Tu nombre y cargo" value={autor} onChange={e=>setAutor(e.target.value)}/>
            <select className="select" value={tipo} onChange={e=>setTipo(e.target.value)}>
              {['Comentario','Alerta','Aprobación','Seguimiento'].map(t=><option key={t}>{t}</option>)}
            </select>
          </div>
          <textarea className="textarea" style={{minHeight:70,marginBottom:8}} placeholder="Escribe tu observación..." value={texto} onChange={e=>setTexto(e.target.value)}></textarea>
          <button className="btn btn-secondary btn-sm" onClick={guardarObs} disabled={!texto||!autor}><i className="ti ti-send"></i> Agregar</button>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cerrar</button>
          {reporte.estado!=='Aprobado' && <button className="btn btn-green" onClick={()=>{onAprobar(reporte.id);onClose();}}><i className="ti ti-check"></i> Aprobar reporte</button>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
